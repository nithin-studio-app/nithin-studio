name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Bump, build & push image, then sync main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHANGESETS_PAT }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@nithin-studio-app"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CHANGESETS_PAT }}

      # actions/checkout already gets main's latest by default, but make it
      # explicit — this must run before any local changes so there's
      # nothing to lose from resetting.
      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # Not tied to any single PR — bumps whatever's currently on main,
      # however many merges have accumulated since the last release. Only
      # used to tag the image consistently; this package is never published
      # to the npm registry itself (private: true, no publish target).
      - name: Bump version
        run: pnpm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # GitHub-hosted runners are amd64 — QEMU is what lets buildx cross-
      # compile for arm64 (the target below) despite that.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the bumped-but-not-yet-committed working tree, same as
      # every other repo's release — the image and the version-sync PR both
      # come from this state. The Dockerfile's own npm_auth_token secret
      # (for installing the private @nithin-studio-app/* deps mid-build) is
      # separate from the ghcr.io login above. linux/arm64 only, targeting
      # this machine specifically — add linux/amd64 back to the platforms
      # list if this ever needs to run somewhere else too.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          secrets: |
            npm_auth_token=${{ secrets.CHANGESETS_PAT }}
          tags: |
            ghcr.io/nithin-studio-app/nithin-studio:${{ steps.version.outputs.value }}
            ghcr.io/nithin-studio-app/nithin-studio:latest

      # Only after a successful push: open a PR to bring main's
      # package.json in line with what was just published.
      - name: Open version-sync PR
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_PAT }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -e
          BRANCH="version-bump"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clear out any leftover branch from a previous failed/interrupted
          # run so this push is a clean create, not a force-overwrite.
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: sync version to v$VERSION"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync version to v$VERSION" \
            --body "v$VERSION was just built and pushed to ghcr.io/nithin-studio-app/nithin-studio. This PR syncs \`package.json\` on \`main\` to match.")
          PR_NUMBER="${PR_URL##*/}"
          gh pr merge --squash --delete-branch "$PR_NUMBER"
