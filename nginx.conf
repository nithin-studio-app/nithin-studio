server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom's BrowserRouter means every non-file path (e.g.
    # /apps/filezilla) is a client-side route, not a real file — fall back
    # to index.html so a hard refresh or deep link doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
